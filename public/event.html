<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Ticketing — Event Details</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <nav class="nav"><a href="index.html" class="logo">Event Ticketing</a></nav>
      </header>

      <main>
        <a href="index.html" class="back-link">← Back to events</a>

        <div id="error" class="message error hidden"></div>
        <div id="loading" class="state">
          <div class="spinner"></div>
          <p>Loading event…</p>
        </div>

        <section id="event-detail" class="hidden">
          <div class="detail-header">
            <h1 id="event-title">Event</h1>
            <div class="detail-meta">
              <span id="event-city"></span>
              <span class="divider" aria-hidden="true">·</span>
              <time id="event-date"></time>
              <span class="divider" aria-hidden="true">·</span>
              <span id="event-venue"></span>
            </div>
            <p id="event-description" class="description"></p>
          </div>

          <section class="tiers-section" aria-label="Ticket tiers">
            <h2>Select Tickets</h2>
            <div id="tiers" class="tier-list"></div>
            <div id="bookError" class="message error hidden" style="margin-top: 1rem;"></div>
          </section>
        </section>

        <div id="empty" class="state hidden">Event not found.</div>
      </main>
    </div>
    <script type="module" src="js/pages/event.js"></script>
  </body>
</html>
